# Render Blueprint — deploying this repo as a Blueprint sets up the whole
# service automatically (no manual build/start commands or env vars needed).
services:
  - type: web
    name: studymate-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      # node:sqlite needs Node 22.5+; pin 24 so hosts never pick an old default.
      - key: NODE_VERSION
        value: "24"
      # Comma-separated list of frontend origins allowed to call the API.
      - key: FRONTEND_ORIGIN
        value: https://studymate-1-green.vercel.app,https://studymate-final.vercel.app
      # Turso (libSQL cloud) — persistent database that survives restarts.
      # Paste these two values in the Render dashboard (Environment tab).
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
